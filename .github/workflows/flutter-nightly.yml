name: Flutter Nightly Build

on:
  workflow_dispatch:
#  schedule trigger disabled by local admin: no auto packaging.
#  Re-add "- cron: '0 0 * * *'" under "schedule:" to restore nightly builds.

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
