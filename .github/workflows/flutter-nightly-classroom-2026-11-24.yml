name: Flutter Nightly Build (Classroom 2026-11-24)

on:
  workflow_dispatch:
  push:
    branches:
      - "p/1.5.3-classroom"
      - "p/1.5.3-controller"
    paths-ignore:
      - "docs/**"
      - "README.md"

permissions:
  contents: write

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
