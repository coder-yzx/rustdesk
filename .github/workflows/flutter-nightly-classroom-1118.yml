name: Flutter Nightly Build (Classroom 11-18)

# 临时触发器（2026-11-18）：原 flutter-nightly.yml 与 11-14 用过的
# flutter-nightly-classroom.yml 路径在 GitHub 上均为 disabled_manually。
# GitHub 按文件路径识别 workflow，全新路径默认 active。出包后删除本文件。

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: ['p/1.5.1-classroom']

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
